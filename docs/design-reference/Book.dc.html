<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Book Cedar A-Frame</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap">
<style>
body{margin:0;font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;color:#111111;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}a:hover{color:inherit;opacity:.88}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}input::placeholder{color:#A3A3A3}
.dark input::placeholder{color:#8E8E8C}
.press{transition:transform .12s ease-out}.press:active{transform:scale(.97)}
.scroll{scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.drift{animation:drift 20s ease-in-out infinite alternate;transform-origin:50% 50%}
@keyframes drift{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.16) translate(-2.5%,-1.5%)}}
.fill{animation:fill .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes fill{from{width:var(--from)}}
.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.out{animation:out .5s ease-in 1.1s both}@keyframes out{to{opacity:0;transform:translateY(-8px)}}
.in{animation:in .5s ease-out 1.4s both}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.sheet{animation:rise .3s cubic-bezier(.2,.8,.2,1) both}@keyframes rise{from{transform:translateY(40px);opacity:.6}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</helmet>
<div class="light" style="width: 393px; height: 852px; position: relative; overflow: hidden; background: #FFFFFF; color: #111111; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; box-sizing: border-box">
<img src="../assets/photos/cedar.jpg" alt="" style="object-position: 50% 50%; position: absolute; left: 0; top: 0; width: 393px; height: 468px; object-fit: cover"><div style="position: absolute; left: 24px; top: 492px; font-size: 28px; line-height: 34px; font-weight: 600; letter-spacing: -0.01em">Cedar A-Frame</div><div style="position: absolute; inset: 0; background: rgba(0,0,0,0.36)"></div><section role="dialog" aria-modal="true" class="sheet" style="position: absolute; left: 0; right: 0; bottom: 0; height: 680px; background: #FFFFFF; border-radius: 20px 20px 0 0; box-shadow: 0 8px 32px rgba(0,0,0,0.08); padding: 10px 24px 34px; box-sizing: border-box; display: flex; flex-direction: column"><div aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 999px; background: #E7E5E4; margin-bottom: 14px"></div><h2 style="margin: 0 0 16px; font-size: 20px; line-height: 26px; font-weight: 600">Your stay</h2><div style="font-size: 13px; line-height: 18px; font-weight: 400; color: #6B6B6B; margin-bottom: 8px">Check-in</div><div role="group" aria-label="Arrival day" style="display: flex; gap: 8px"><sc-for list="{{days}}" as="day" hint-placeholder-count="5"><button type="button" onClick="{{day.pick}}" style="flex: 1; height: 56px; border-radius: 999px; border: 1px solid {{day.bd}}; background: {{day.bg}}; color: {{day.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0"><span style="font-size: 13px; line-height: 18px; font-weight: 400">{{day.d}}</span><span style="font-size: 15px; line-height: 20px; font-weight: 600">{{day.n}}</span></button></sc-for></div><div style="margin-top: 12px; display: flex; flex-direction: column"><div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px"><span style="display: flex; flex-direction: column"><span style="font-size: 17px; line-height: 24px; font-weight: 400">Nights</span><span style="font-size: 13px; line-height: 18px; font-weight: 400; color: #6B6B6B">Out Sun 27</span></span><div style="display: flex; align-items: center; gap: 14px"><button type="button" aria-label="Fewer nights" style="width: 36px; height: 36px; border-radius: 999px; border: 1px solid #E7E5E4; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; display: block"><path d="M5 12h14"/></svg></button><span style="font-size: 17px; line-height: 24px; font-weight: 600; min-width: 12px; text-align: center">3</span><button type="button" aria-label="More nights" style="width: 36px; height: 36px; border-radius: 999px; border: 1px solid #E7E5E4; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; display: block"><path d="M12 5v14M5 12h14"/></svg></button></div></div><div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px"><span style="display: flex; flex-direction: column"><span style="font-size: 17px; line-height: 24px; font-weight: 400">Guests</span></span><div style="display: flex; align-items: center; gap: 14px"><button type="button" aria-label="Fewer guests" style="width: 36px; height: 36px; border-radius: 999px; border: 1px solid #E7E5E4; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; display: block"><path d="M5 12h14"/></svg></button><span style="font-size: 17px; line-height: 24px; font-weight: 600; min-width: 12px; text-align: center">2</span><button type="button" aria-label="More guests" style="width: 36px; height: 36px; border-radius: 999px; border: 1px solid #E7E5E4; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; display: block"><path d="M12 5v14M5 12h14"/></svg></button></div></div></div><div style="margin-top: 12px; border-top: 0.5px solid #E7E5E4"><div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 0.5px solid #E7E5E4; font-size: 15px; line-height: 20px; font-weight: 400"><span>2 free nights (from your bank)</span><span style="font-variant-numeric: tabular-nums">$0</span></div><div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 0.5px solid #E7E5E4; font-size: 15px; line-height: 20px; font-weight: 400"><span>1 night at 50%</span><span style="font-variant-numeric: tabular-nums">$110</span></div><div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 0.5px solid #E7E5E4; font-size: 15px; line-height: 20px; font-weight: 400"><span>Cleaning</span><span style="font-variant-numeric: tabular-nums">$85</span></div><div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 0.5px solid #E7E5E4; font-size: 15px; line-height: 20px; font-weight: 400"><span>Taxes</span><span style="font-variant-numeric: tabular-nums">$18</span></div><div style="display: flex; justify-content: space-between; padding: 12px 0 0; font-size: 17px; line-height: 24px; font-weight: 600"><span>Total</span><span>$213</span></div></div><div style="margin-top: 8px"><div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px"><span id="sw-label" style="font-size: 17px; line-height: 24px; font-weight: 400">Use free nights</span><button type="button" role="switch" aria-checked="true" aria-labelledby="sw-label" style="position: relative; width: 51px; height: 31px; border-radius: 999px; border: 0; padding: 0; background: #111111"><span style="position: absolute; top: 2px; left: 22px; width: 27px; height: 27px; border-radius: 999px; background: #FFFFFF"></span></button></div></div><div style="margin-top: auto"><a class="press" href="Confirmed.dc.html" aria-label="Pay with Apple Pay" style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 56px; border-radius: 999px; background: #000000; color: #FFFFFF; font-size: 19px; line-height: 24px; font-weight: 600; letter-spacing: -0.01em"><span>Apple Pay</span></a></div></section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    const sel = this.state.sel ?? 0;
    const days = [['Thu','24'],['Fri','25'],['Sat','26'],['Sun','27'],['Mon','28']].map(([d, n], i) => ({
      d, n, bg: i === sel ? '#111111' : '#FFFFFF', fg: i === sel ? '#FFFFFF' : '#111111', bd: i === sel ? '#111111' : '#E7E5E4',
      pick: () => this.setState({ sel: i })
    }));
    return { days };
  }
}
</script>
</body>
</html>
